<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Elojob</title>

    <link rel="stylesheet" href="adicionar.css">

</head>

<body>

<form id="form">

    <h1>Novo Elojob</h1>

    <input
        id="boost"
        placeholder="Ex: L1 → M1"
        required>

    <input
        id="booster"
        placeholder="Booster"
        required>

    <input
        id="tag"
        placeholder="Tag do Cliente (Ex: #2ABCDEF)"
        required>

    <!-- Card do jogador -->
    <div id="player-info" class="player-info" style="display:none;">

        <h3>Cliente encontrado!</h3>

        <div class="player-item">
            👤 <span id="player-name"></span>
        </div>

        <div class="player-item">
            🏆 <span id="player-trophies"></span>
        </div>

        <div class="player-item">
            🏰 <span id="player-club"></span>
        </div>

        <div class="player-item">
            ⭐ Nível <span id="player-level"></span>
        </div>

    </div>

    <input
        type="number"
        step="0.01"
        id="preco"
        placeholder="Preço (USD)"
        required>

    <input
        type="number"
        id="horas"
        placeholder="Horas"
        required>

    <input
        type="password"
        id="senha"
        placeholder="Senha"
        required>

    <button type="submit">

        Adicionar

    </button>

</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="adicionar.js"></script>

</body>

</html>
