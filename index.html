<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EloJobs Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <div>

        <h1>🎮 EloJobs Dashboard</h1>

        <p>Gerencie todos os boosts em tempo real.</p>

    </div>

    <a href="adicionar.html" class="btn">

        + Novo Elojob

    </a>

</header>

<section class="dashboard">

    <div class="box">

        <span>Elojobs Ativos</span>

        <h2 id="ativos">0</h2>

    </div>

    <div class="box">

        <span>Valor Total</span>

        <h2 id="valor">$0.00</h2>

    </div>

    <div class="box">

        <span>Boosters</span>

        <h2 id="boosters">0</h2>

    </div>

    <div class="box">

        <span>Finalizados</span>

        <h2 id="finalizados">0</h2>

    </div>

</section>

<input
id="pesquisa"
type="text"
placeholder="🔍 Pesquisar boost ou booster...">

<div id="cards"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>

</body>

</html>
