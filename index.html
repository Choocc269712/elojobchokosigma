<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lunars Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <div>

        <h1>🏆 Lunars Dashboard</h1>

        <p>Painel de gerenciamento de EloJobs.</p>

    </div>

    <div class="header-buttons">

        <a href="adicionar.html" class="btn">

            + Novo Elojob

        </a>

    </div>

</header>

<section class="dashboard">

    <div class="box">

        <span>📋 Elojobs Ativos</span>

        <h2 id="ativos">0</h2>

    </div>

    <div class="box">

        <span>💰 Valor Total</span>

        <h2 id="valor">$0.00</h2>

    </div>

    <div class="box">

        <span>👥 Boosters Online</span>

        <h2 id="boosters">0</h2>

    </div>

    <div class="box">

        <span>✅ Finalizados</span>

        <h2 id="finalizados">0</h2>

    </div>

</section>

<section class="filtros">

    <input
        id="pesquisa"
        type="text"
        placeholder="🔍 Pesquisar por booster, boost ou rank...">

    <select id="filtro-rank">

        <option value="">Todos os Ranks</option>

        <option>Bronze</option>
        <option>Prata</option>
        <option>Ouro</option>
        <option>Diamante</option>
        <option>Mítico</option>
        <option>Lendário</option>
        <option>Mestre</option>
        <option>Pro</option>

    </select>

</section>

<div id="cards">

    <!-- Os cards serão adicionados pelo script.js -->

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>

</body>

</html>
